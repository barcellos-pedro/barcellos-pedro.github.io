    direct_contact: CONTATO DIRETO
    location: LOCALIZAÇÃO
    print: Imprimir / Salvar PDF
    contact: Fale comigo
    philosophy_label: 01 / FILOSOFIA TÉCNICA
    philosophy_title: Engenharia guiada por resiliência e clareza
    philosophy:
      - "Acredito que a excelência em engenharia de software nasce da simplicidade arquitetural e da previsibilidade operacional. Em ambientes corporativos como o Corporate Banking do Itaú Unibanco, cada linha de código precisa ser projetada para suportar grandes volumes de transações mantendo latência ultrabaixa."
      - "Minha experiência transita entre sistemas distribuídos em nuvem (Java, Kafka, AWS, Kubernetes) e interfaces web intuitivas e performáticas (TypeScript, Angular, Node.js). Essa visão de ponta a ponta ajuda a antecipar gargalos de integração, criar ferramentas amigáveis para desenvolvedores e garantir observabilidade profunda em produção."
    experience_label: 02 / LINHA DO TEMPO PROFISSIONAL
    experience_title: Experiência profissional
    architecture_label: 03 / ESTUDOS DE CASO
    architecture_title: Arquiteturas e projetos em destaque
    skills_label: 04 / COMPETÊNCIAS
    skills_title: Competências e matriz técnica
    education_label: 05 / FORMAÇÃO ACADÊMICA
    education_title: Formação
    experience:
      - company: Itaú Unibanco
        role: Engenheiro de Software Backend
        period: "set. 2023 — Presente"
        description: "Desenvolvimento e engenharia de APIs escaláveis de alto desempenho e microsserviços essenciais que sustentam os ecossistemas mobile e web do segmento Corporate Banking (PJ)."
        bullets:
          - "Responsabilidade pelo ciclo completo: desenho arquitetural, execução de código resiliente, provisionamento de infraestrutura e monitoramento ativo."
          - "Implementação de arquiteturas orientadas a eventos com Apache Kafka para mensageria assíncrona de alta vazão."
          - "Construção de pipelines robustos de CI/CD com GitHub Actions e AWS, acelerando entregas contínuas com práticas rigorosas de segurança."
          - "Deploy e orquestração de microsserviços conteinerizados em clusters Kubernetes gerenciados pelo AWS EKS."
          - "Monitoramento e observabilidade avançados com Prometheus, AppDynamics, Splunk e Grafana para detecção contínua de anomalias."
      - company: Itaú Unibanco
        role: Engenheiro de Software Frontend
        period: "set. 2021 — set. 2023"
        description: "Arquitetura e manutenção de ferramentas internas para otimizar a automação de fluxos e a produtividade de desenvolvedores em equipes do banco."
        bullets:
          - "Desenvolvimento de integrações e plugins personalizados para unificar a comunicação entre sistemas e plataformas internas."
          - "Automação de fluxos serverless na AWS usando Node.js, AWS Lambda e TypeScript."
          - "Elaboração de documentação técnica completa para padronização de ferramentas e integração de novos desenvolvedores."
          - "Garantia de confiabilidade por meio de testes unitários e de integração automatizados com Jest."
      - company: Betalabs
        role: Desenvolvedor Frontend
        period: "out. 2020 — ago. 2021"
        description: "Construção de interfaces reativas para modelos de assinatura SaaS e aplicações web de comércio eletrônico."
        bullets:
          - "Prototipação técnica de novas funcionalidades e layouts de interface usando Figma."
          - "Construção de componentes frontend escaláveis e pipelines de gerenciamento de estado com Angular e NgRx."
          - "Refatoração de código legado, correção de bugs de interface e evolução contínua de UI/UX com SASS e Bootstrap."
    architectures:
      - title: Plataforma de APIs para Corporate Banking de alta vazão
        category: PLATAFORMA DE API E STREAMING
        period: 2023 — Presente
        description: "Arquitetura desacoplada de microsserviços Kubernetes para o setor bancário corporativo, com pipelines de streaming via Apache Kafka e cache Redis de alto desempenho."
      - title: Ecossistema de ferramentas e plugins internos
        category: FERRAMENTAS DE DESENVOLVIMENTO E AUTOMAÇÃO
        period: 2021 — 2023
        description: "Solução serverless baseada em AWS Lambda e Node.js para automatizar fluxos operacionais, eliminar silos entre equipes e melhorar o ritmo de entrega."
    skills:
      - category: Backend e sistemas
        items: ["Java e Spring Boot", "Apache Kafka e event streaming", "Redis (cache e estado)", "Design de APIs RESTful e arquitetura distribuída", "Node.js e Express"]
      - category: Cloud, DevOps e observabilidade
        items: ["AWS (EKS, Lambda, EC2, S3)", "Kubernetes e Docker", "CI/CD (GitHub Actions, AWS CodePipeline)", "Prometheus e Grafana", "Splunk e AppDynamics"]
      - category: Frontend e interfaces
